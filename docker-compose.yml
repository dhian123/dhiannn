version: '3.8'\n\nservices:\n  # PostgreSQL Database\n  postgres:\n    image: postgres:14-alpine\n    container_name: sinusa-postgres\n    environment:\n      POSTGRES_DB: sinusa_dev\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: password\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql\n    ports:\n      - \"5432:5432\"\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n\n  # Redis Cache\n  redis:\n    image: redis:7-alpine\n    container_name: sinusa-redis\n    command: redis-server --appendonly yes --requirepass redispassword\n    volumes:\n      - redis_data:/data\n    ports:\n      - \"6379:6379\"\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n\n  # Backend API\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: sinusa-backend\n    environment:\n      NODE_ENV: development\n      PORT: 3000\n      DB_HOST: postgres\n      DB_PORT: 5432\n      DB_NAME: sinusa_dev\n      DB_USERNAME: postgres\n      DB_PASSWORD: password\n      REDIS_HOST: redis\n      REDIS_PORT: 6379\n      REDIS_PASSWORD: redispassword\n      JWT_SECRET: your_super_secret_jwt_key_here_make_it_very_long_and_random\n      JWT_REFRESH_SECRET: your_super_secret_refresh_jwt_key_here_make_it_very_long_and_random\n      ENCRYPTION_KEY: your_32_character_encryption_key_here_make_it_random_and_secure\n      OTP_SECRET: your_otp_secret_key_here\n      FRONTEND_URL: http://localhost:3000\n      MOCK_EMAIL: true\n      MOCK_SMS: true\n      SWAGGER_ENABLED: true\n    volumes:\n      - ./backend/uploads:/app/uploads\n      - ./backend/logs:/app/logs\n    ports:\n      - \"3000:3000\"\n    depends_on:\n      - postgres\n      - redis\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n\n  # Nginx Reverse Proxy\n  nginx:\n    image: nginx:alpine\n    container_name: sinusa-nginx\n    volumes:\n      - ./nginx/nginx.conf:/etc/nginx/nginx.conf\n      - ./nginx/ssl:/etc/nginx/ssl\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    depends_on:\n      - backend\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n\n  # Adminer for database management (development only)\n  adminer:\n    image: adminer:latest\n    container_name: sinusa-adminer\n    ports:\n      - \"8080:8080\"\n    depends_on:\n      - postgres\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n    profiles:\n      - dev\n\n  # Redis Commander for Redis management (development only)\n  redis-commander:\n    image: rediscommander/redis-commander:latest\n    container_name: sinusa-redis-commander\n    environment:\n      REDIS_HOSTS: local:redis:6379:0:redispassword\n    ports:\n      - \"8081:8081\"\n    depends_on:\n      - redis\n    networks:\n      - sinusa-network\n    restart: unless-stopped\n    profiles:\n      - dev\n\nvolumes:\n  postgres_data:\n    driver: local\n  redis_data:\n    driver: local\n\nnetworks:\n  sinusa-network:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 172.20.0.0/16