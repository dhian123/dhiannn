version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sinusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sinusa_db
      POSTGRES_USER: sinusa_user
      POSTGRES_PASSWORD: sinusa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - sinusa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinusa_user -d sinusa_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sinusa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - sinusa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sinusa-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sinusa_user:sinusa_password@postgres:5432/sinusa_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    volumes:
      - ../backend/logs:/app/logs
      - ../backend/uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sinusa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sinusa-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ../backend/uploads:/var/www/uploads
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - sinusa-network

  # Web Portal (Optional)
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: sinusa-web
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: https://api.sinusa.com
      REACT_APP_ENVIRONMENT: production
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - sinusa-network

  # Admin Panel (Optional)
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: sinusa-admin
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: https://api.sinusa.com
      REACT_APP_ENVIRONMENT: production
    ports:
      - "3002:3000"
    depends_on:
      - backend
    networks:
      - sinusa-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: sinusa-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - sinusa-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: sinusa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    networks:
      - sinusa-network

  # Backup Service
  backup:
    image: postgres:15-alpine
    container_name: sinusa-backup
    restart: "no"
    environment:
      POSTGRES_DB: sinusa_db
      POSTGRES_USER: sinusa_user
      POSTGRES_PASSWORD: sinusa_password
      POSTGRES_HOST: postgres
    volumes:
      - ./backup:/backup
    depends_on:
      - postgres
    networks:
      - sinusa-network
    command: |
      sh -c '
        while true; do
          echo "Starting backup at $(date)"
          pg_dump -h postgres -U sinusa_user -d sinusa_db > /backup/backup_$(date +%Y%m%d_%H%M%S).sql
          echo "Backup completed at $(date)"
          sleep 86400
        done
      '

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  sinusa-network:
    driver: bridge