name: sinusa_mobile
description: SiNusa - Islamic Boarding School Management System Mobile App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # HTTP & API
  dio: ^5.3.2
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  file_picker: ^6.1.1

  # Navigation
  go_router: ^12.1.3
  auto_route: ^7.8.4

  # Forms & Validation
  form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # Charts & Data Visualization
  fl_chart: ^0.65.0
  syncfusion_flutter_charts: ^23.2.7

  # Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0

  # QR Code & Barcode
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9

  # PDF & Documents
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1

  # Connectivity
  connectivity_plus: ^5.0.2
  internet_connection_checker: ^1.0.0+1

  # Permissions
  permission_handler: ^11.1.0

  # Biometric Authentication
  local_auth: ^2.1.7

  # Camera & Media
  camera: ^0.10.5+5
  photo_view: ^0.14.0

  # Maps & Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

  # Social Sharing
  share_plus: ^7.2.1

  # WebView
  webview_flutter: ^4.4.2

  # Animation
  lottie: ^2.7.0
  rive: ^0.12.4

  # Utils
  url_launcher: ^6.2.2
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.1
  flutter_native_splash: ^2.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  retrofit_generator: ^7.0.8
  auto_route_generator: ^7.3.2

  # Linting
  flutter_lints: ^3.0.1
  custom_lint: ^0.5.7
  riverpod_lint: ^2.3.9

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#1E3A8A"
  image: assets/images/logo.png
  branding: assets/images/branding.png
  color_dark: "#0F172A"
  image_dark: assets/images/logo_dark.png
  branding_dark: assets/images/branding_dark.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#1E3A8A"
    image_dark: assets/images/logo_dark.png
    icon_background_color_dark: "#0F172A"

  web: false